<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block titulo %}Agua y Jardín{% endblock %} · Agua y Jardín</title>
<link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}"></head><body>
{% if usuario %}<header>
 <a class="marca" href="{{ url_for('rutas.inicio') }}"><img src="/recursos/logo.svg" width="34" alt="">Agua y Jardín</a>
 <nav>
  <a href="{{ url_for('rutas.inicio') }}" class="{{ 'act' if request.endpoint=='rutas.inicio' }}">Inicio</a>
  <a href="{{ url_for('rutas.clientes') }}" class="{{ 'act' if 'cliente' in request.endpoint }}">Clientes</a>
  <a href="{{ url_for('rutas.cotizaciones') }}" class="{{ 'act' if 'cotizacion' in request.endpoint }}">Cotizaciones</a>
  <a href="{{ url_for('rutas.obras') }}" class="{{ 'act' if request.endpoint=='rutas.obras' }}">Obras</a>
 </nav>
 <div class="usr">{{ usuario.nombre }} · {{ usuario.rol }}
  <form class="inline" method="post" action="{{ url_for('rutas.salir') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="btn sec sm" style="color:#fff;border-color:#cfe0f1;background:transparent">Salir</button></form></div>
</header>{% endif %}
<main>{% with m = get_flashed_messages(with_categories=true) %}{% for cat, t in m %}<div class="msg {{ cat }}">{{ t }}</div>{% endfor %}{% endwith %}
{% block cuerpo %}{% endblock %}</main></body></html>
